[package]
categories = ["api-bindings", "web-programming"]
description = "A Matrix client library."
homepage = "https://ruma.dev/"
keywords = ["matrix", "chat", "messaging", "ruma"]
license = "MIT"
name = "ruma-client"
readme = "README.md"
repository = "https://github.com/ruma/ruma-client"
version = "0.15.0"
edition = "2021"
rust-version = "1.81"

[package.metadata.docs.rs]
all-features = true

[features]
client-api = ["dep:as_variant", "dep:ruma-client-api"]

# HTTP clients
hyper = ["dep:http-body-util", "dep:hyper", "dep:hyper-util"]
hyper-native-tls = ["hyper", "dep:hyper-tls"]
hyper-rustls = ["hyper", "dep:hyper-rustls"]
reqwest = ["dep:reqwest"]
reqwest-native-tls = ["reqwest", "reqwest?/native-tls"]
reqwest-native-tls-alpn = ["reqwest", "reqwest?/native-tls-alpn"]
reqwest-native-tls-vendored = ["reqwest", "reqwest?/native-tls-vendored"]
reqwest-rustls-manual-roots = ["reqwest", "reqwest?/rustls-tls-manual-roots"]
reqwest-rustls-webpki-roots = ["reqwest", "reqwest?/rustls-tls-webpki-roots"]
reqwest-rustls-native-roots = ["reqwest", "reqwest?/rustls-tls-native-roots"]

[dependencies]
as_variant = { version = "1.2.0", optional = true }
assign = "1.1.1"
async-stream = "0.3.0"
bytes = "1.0.1"
futures-core = "0.3.8"
http = "1.1.0"
http-body-util = { version = "0.1.1", optional = true }
hyper = { version = "1.3.1", optional = true, features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27.1", optional = true, default-features = false }
hyper-tls = { version = "0.6.0", optional = true }
hyper-util = { version = "0.1.3", optional = true, features = ["client-legacy", "http1", "http2", "tokio"] }
reqwest = { version = "0.12.4", optional = true, default-features = false }
ruma-client-api = { version = "0.20.1", optional = true, features = ["client"] }
ruma-common = { version = "0.15.1", features = ["api"] }
serde_html_form = "0.2.0"
tracing = { version = "0.1.30", default-features = false, features = ["std"] }

[dev-dependencies]
ruma-client-api = { version = "0.20.1", features = ["client"] }
tokio-stream = "0.1.8"

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
semicolon_in_expressions_from_macros = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(ruma_identifiers_storage, values("Arc"))', # used by the IdZst macro
    'cfg(ruma_unstable_exhaustive_types)', # set all types as exhaustive
] }
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"

[lints.clippy]
branches_sharing_code = "warn"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
disallowed_types = "warn"
empty_line_after_outer_attr = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"
inefficient_to_string = "warn"
macro_use_imports = "warn"
map_flatten = "warn"
missing_enforced_import_renames = "warn"
mod_module_files = "warn"
mut_mut = "warn"
nonstandard_macro_braces = "warn"
semicolon_if_nothing_returned = "warn"
str_to_string = "warn"
todo = "warn"
unreadable_literal = "warn"
unseparated_literal_suffix = "warn"
wildcard_imports = "warn"

# Not that good of a lint
new_without_default = "allow"
# Disabled temporarily because it triggers false positives for types with generics.
arc_with_non_send_sync = "allow"
